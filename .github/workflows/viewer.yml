name: Viewer codespace

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [up, stop, probe, recreate]
        default: up
      branch:
        type: string
        required: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: viewer-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
      ACTION: ${{ inputs.action || 'up' }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Skip until the token exists
        id: ready
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "CODESPACES_TOKEN is not set; no codespace touched" | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Create, start or stop the codespace
        if: steps.ready.outputs.go == 'true'
        run: |
          api() { gh api -H "Accept: application/vnd.github+json" "$@"; }
          find() { api "repos/$REPO/codespaces" --paginate --jq ".codespaces[] | select(.git_status.ref == \"$BRANCH\") | .name" | head -1; }
          name=$(find)

          if [ "$ACTION" = probe ]; then
            [ -n "$name" ] || { echo "no codespace for $BRANCH"; exit 1; }
            {
              echo "Codespace: $name ($(api "user/codespaces/$name" --jq .state))"
              echo "App answers: $(curl -s -o /dev/null -w '%{http_code}' -H "X-Github-Token: $GH_TOKEN" "https://$name-8080.app.github.dev/")"
              echo '```'
              gh codespace ssh -c "$name" -- 'ls -la /tmp; tail -n 40 /tmp/viewer.log; echo ---; tail -n 20 /tmp/viewer-app.log; echo ---; cat /tmp/viewer-seed.txt; echo ---; ps -eo pid,etime,args --sort=start_time | grep -E "viewer|supabase|bun|git|vite|docker" | grep -v grep | cut -c1-160; echo ---; tail -n 40 /workspaces/.codespaces/.persistedshare/creation.log; echo ---; docker ps -a --format "{{.Names}} {{.Status}}"; echo ---; docker logs --tail 60 supabase_edge_runtime_poancmeitlmxejofwzuu 2>&1 | grep -v "wall clock"; echo ---; cd /workspaces/ai4good && grep -E "^DISCOVERY_(PROVIDER|MODEL|BASE_URL|REASONING_EFFORT)=" supabase/functions/.env; grep -oE "^(DISCOVERY_API_KEY|ANTHROPIC_API_KEY)=" supabase/functions/.env; set -a; . supabase/functions/.env; set +a; echo "model endpoint: $(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DISCOVERY_API_KEY" "$DISCOVERY_BASE_URL/models")"; echo ---; bash .devcontainer/smoke.sh' 2>&1 | tail -n 150
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$ACTION" = stop ]; then
            [ -n "$name" ] && api -X POST "user/codespaces/$name/stop" > /dev/null
            echo "Stopped ${name:-nothing} for $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$ACTION" = recreate ] && [ -n "$name" ]; then
            api -X DELETE "user/codespaces/$name" > /dev/null
            name=""
          fi

          if [ -z "$name" ]; then
            name=$(api -X POST "repos/$REPO/codespaces" -f ref="$BRANCH" -f machine=basicLinux32gb -f geo=EuropeWest \
              -F idle_timeout_minutes=30 -F retention_period_minutes=4320 -f display_name="${BRANCH: -48}" --jq .name)
          fi
          for _ in $(seq 1 80); do
            state=$(api "user/codespaces/$name" --jq .state)
            case "$state" in
              Available) break ;;
              Shutdown) api -X POST "user/codespaces/$name/start" > /dev/null ;;
            esac
            sleep 10
          done
          [ "$state" = Available ] || { echo "codespace $name is $state"; exit 1; }

          url="https://$name-8080.app.github.dev"
          echo "url=$url" >> "$GITHUB_ENV"
          for _ in $(seq 1 12); do
            gh codespace ssh -c "$name" -- 'pgrep -f "bash .devcontainer/viewer.sh" > /dev/null || (cd /workspaces/ai4good && setsid -f nohup bash .devcontainer/viewer.sh > /tmp/viewer.log 2>&1 < /dev/null); echo viewer script running' && break
            sleep 10
          done
          {
            echo "Codespace: $name ($state)"
            echo "App: $url (the app is up a few minutes after this; GitHub login required)"
            echo "Sign in as preview-ngo@ai4good.example"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Put the link on the commit
        if: steps.ready.outputs.go == 'true' && (env.ACTION == 'up' || env.ACTION == 'recreate')
        env:
          GH_TOKEN: ${{ github.token }}
          CODESPACES_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
          post() { gh api -X POST "repos/$REPO/statuses/$sha" -f state="$1" -f context=viewer -f target_url="$url" -f description="$2" > /dev/null; }
          post pending "Codespace running; app starting"
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Github-Token: $CODESPACES_TOKEN" "$url/")
            [ "$code" = 200 ] && { post success "App answering"; exit 0; }
            sleep 10
          done
          post failure "App did not answer within 15 minutes"
