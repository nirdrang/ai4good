<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to ai4good</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0f172a}a:hover{color:#334155}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif;padding:72px 24px 24px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:15px;font-weight:700;letter-spacing:.02em;color:#166534">ai4good</span>
    <h1 style="margin:0;font-size:28px;line-height:34px;font-weight:700">Sign in to ai4good</h1>
    <p style="margin:0;font-size:16px;line-height:24px;color:#475569">Continue your project where you left off.</p>
    <p style="margin:0;font-size:14px;line-height:20px;color:#475569;background:#f1f5f9;border-radius:10px;padding:8px 12px">Preview: any password opens the sample account of Dana at Harbor Community Kitchen, starting fresh.</p>
  </div>
  <form onSubmit="{{submit}}" style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="email" style="font-size:15px;font-weight:600">Email</label>
      <input id="email" data-testid="email" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" style="height:48px;border-radius:10px;border:1px solid #94a3b8;padding:0 14px;font-size:16px">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="password" style="font-size:15px;font-weight:600">Password</label>
      <input id="password" data-testid="password" type="password" autocomplete="current-password" value="{{password}}" onChange="{{onPassword}}" style="height:48px;border-radius:10px;border:1px solid #94a3b8;padding:0 14px;font-size:16px">
    </div>
    <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
      <p role="alert" style="margin:0;font-size:14px;color:#b91c1c">Enter your email and password.</p>
    </sc-if>
    <sc-if value="{{canGo}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" data-testid="sign-in" style="display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:#0f172a;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none">Sign in</a>
    </sc-if>
    <sc-if value="{{cannotGo}}" hint-placeholder-val="{{ true }}">
      <button type="submit" data-testid="sign-in" style="height:48px;border-radius:10px;border:none;background:#0f172a;color:#ffffff;font-size:16px;font-weight:600;cursor:pointer">Sign in</button>
    </sc-if>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: 'dana@harborkitchen.org', password: '', error: false }; }
  renderVals() {
    const s = this.state;
    const ok = s.email.trim() !== '' && s.password !== '';
    return {
      email: s.email, password: s.password, error: s.error, canGo: ok, cannotGo: !ok,
      onEmail: (e) => this.setState({ email: e.target.value, error: false }),
      onPassword: (e) => this.setState({ password: e.target.value, error: false }),
      submit: (e) => { e.preventDefault(); this.setState({ error: true }); }
    };
  }
}
</script>
</body>
</html>
